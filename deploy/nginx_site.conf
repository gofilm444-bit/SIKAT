server {
    listen 80;
    server_name example.com;  # TODO: ganti domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;  # TODO: ganti domain

    ssl_certificate     /etc/ssl/certs/your_cert.pem;     # TODO: ganti path
    ssl_certificate_key /etc/ssl/private/your_key.pem;    # TODO: ganti path

    # Wajib arahkan docroot ke /public
    root /var/www/ski_new/public;  # TODO: ganti path
    index index.php index.html;

    # Hardening rules
    include /var/www/ski_new/deploy/nginx_hardening_snippet.conf;  # TODO: sesuaikan path

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;  # TODO: sesuaikan versi/socket
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }

    client_max_body_size 20m;
}
