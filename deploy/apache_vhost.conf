<VirtualHost *:80>
    ServerName example.com
    Redirect permanent / https://example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    DocumentRoot "/var/www/ski_new/public"

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/your_cert.pem
    SSLCertificateKeyFile /etc/ssl/private/your_key.pem

    <Directory "/var/www/ski_new/public">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/var/www/ski_new">
        Require all denied
    </Directory>

    <Directory "/var/www/ski_new/storage">
        Require all denied
    </Directory>
    <Directory "/var/www/ski_new/storage_sql_backup">
        Require all denied
    </Directory>
    <Directory "/var/www/ski_new/upload">
        Require all denied
    </Directory>
    <Directory "/var/www/ski_new/uploads">
        Require all denied
    </Directory>
    <Directory "/var/www/ski_new/config">
        Require all denied
    </Directory>
    <Directory "/var/www/ski_new/vendor">
        Require all denied
    </Directory>
    <Directory "/var/www/ski_new/deploy">
        Require all denied
    </Directory>
    <Directory "/var/www/ski_new/cron">
        Require all denied
    </Directory>
    <Directory "/var/www/ski_new/tools">
        Require all denied
    </Directory>

    <FilesMatch "\.(sql|log|bak|zip|rar|7z|tar|gz|md)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <Files ".env">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/ski_new_error.log
    CustomLog ${APACHE_LOG_DIR}/ski_new_access.log combined
</VirtualHost>
